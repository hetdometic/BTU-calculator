name: Remove multi-unit advisory

on:
  push:
    branches:
      - logic-only-2026
    paths:
      - .github/workflows/remove-multi-warning.yml

permissions:
  contents: write

jobs:
  remove-warning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: logic-only-2026
          fetch-depth: 0
      - name: Remove only multi-unit yellow advisory
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          target = '        if (acRec?.unitCount > 1 && state.mode !== "furnace") alerts.push(`${acRec.unitCount}-unit FreshJet 5 capacity plan: verify roof openings, electrical service or generator capacity, ducts/air distribution, and controls/zoning.`);\n'
          assert s.count(target) == 1, 'Expected multi-unit advisory line not found exactly once'
          s = s.replace(target, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, re.S)
          assert scripts
          Path('/tmp/app.js').write_text(scripts[-1], encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove multi-unit recommendation advisory"
          git push origin HEAD:logic-only-2026
