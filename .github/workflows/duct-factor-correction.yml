name: Correct ASHRAE duct factor

on:
  push:
    branches:
      - logic-only-2026
    paths:
      - .github/workflows/duct-factor-correction.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: logic-only-2026
          fetch-depth: 0
      - name: Apply guarded correction
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          style=re.search(r'<style>.*?</style>',t,re.S).group(0)
          old='''      function distributionLossAdder(subtotal, lossFraction) {\n        const loss = clamp(lossFraction, 0, 0.30);\n        return loss > 0 ? subtotal * loss / (1 - loss) : 0;\n      }'''
          new='''      function distributionLossAdder(subtotal, lossFraction) {\n        const loss = clamp(lossFraction, 0, 0.30);\n        return subtotal * loss;\n      }'''
          assert t.count(old)==1, f'expected one duct function, found {t.count(old)}'
          t=t.replace(old,new,1)
          assert re.search(r'<style>.*?</style>',t,re.S).group(0)==style, 'CSS changed'
          assert t.count('<dialog class="advanced-modal" id="advancedModal"')==1
          assert '<script src=' not in t
          p.write_text(t,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          s=re.findall(r'<script>(.*?)</script>',t,re.S)[-1]
          Path('/tmp/app.js').write_text(s,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use ASHRAE-style additive duct loss factor"
          git push origin HEAD:logic-only-2026
